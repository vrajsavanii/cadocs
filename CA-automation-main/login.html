<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CA Firm Automation Suite</title>
    <style>
        :root {
            --bg-color: #EBE9E4; /* Warm limestone */
            --primary-color: #19201C; /* Deep forest green */
            --accent-color: #EBF8EE; /* Mint accent */
            --text-color: #333333;
            --error-color: #d9534f;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-circle {
            background-color: var(--primary-color);
            color: var(--accent-color);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 16px;
            letter-spacing: 1px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d1d1;
            border-radius: 8px;
            font-size: 15px;
            transition: var(--transition);
            background: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(25, 32, 28, 0.1);
            background: #fff;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 36px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .remember-group {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
        }

        .remember-group input[type="checkbox"] {
            margin-right: 10px;
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
        }

        .remember-group label {
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-btn:hover {
            background-color: #242c27;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
            text-decoration: none;
            transition: var(--transition);
        }

        .forgot-password:hover {
            color: var(--primary-color);
        }

        #error-msg {
            color: var(--error-color);
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
            padding: 10px;
            background-color: rgba(217, 83, 79, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(217, 83, 79, 0.2);
        }

        #role-badge {
            display: none;
            text-align: center;
            margin-top: 16px;
            padding: 6px 12px;
            background-color: var(--accent-color);
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
        }

        .demo-creds-box {
            margin-top: 24px;
            padding: 14px;
            background: #F7F6F2;
            border: 1px solid #E5E2D9;
            border-radius: 12px;
            text-align: center;
        }
        .demo-creds-title {
            font-size: 11px;
            font-weight: 700;
            color: #5C635E;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
        }
        .demo-chips {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .demo-chip {
            background: #FFFFFF;
            border: 1px solid #D5D1C5;
            color: #19201C;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            cursor: pointer;
            transition: all 0.16s ease;
            font-family: inherit;
        }
        .demo-chip:hover {
            background: #19201C;
            color: #FFFFFF;
            border-color: #19201C;
            transform: translateY(-1px);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <div class="logo-circle">CA</div>
            <div class="logo-text">CA Firm Automation Suite</div>
        </div>

        <div id="error-msg"></div>
        <div id="role-badge"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="admin@firm.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                <button type="button" class="password-toggle" id="toggle-pwd" aria-label="Toggle password visibility">
                    <!-- Eye icon SVG -->
                    <svg id="eye-show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <!-- Eye off icon SVG (hidden by default) -->
                    <svg id="eye-hide" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <div class="remember-group">
                <input type="checkbox" id="remember">
                <label for="remember">Remember Me</label>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">Sign In</button>
        </form>

        <a href="#" class="forgot-password" onclick="alert('Please contact your firm administrator to reset your password.')">Forgot Password? Contact your firm administrator</a>

        <div class="demo-creds-box">
            <div class="demo-creds-title">⚡ Quick Sign-In Accounts</div>
            <div class="demo-chips">
                <button type="button" class="demo-chip" onclick="fillCreds('admin@hostel.local','hostel123')">
                    <strong>Admin</strong> · hostel123
                </button>
                <button type="button" class="demo-chip" onclick="fillCreds('partner@cafirm.com','Admin@1234')">
                    <strong>Partner</strong> · Admin@1234
                </button>
                <button type="button" class="demo-chip" onclick="fillCreds('manager@cafirm.com','Admin@1234')">
                    <strong>Manager</strong> · Admin@1234
                </button>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(email, password) {
            const emailInput = document.getElementById('email');
            const pwdInput = document.getElementById('password');
            if (emailInput && pwdInput) {
                emailInput.value = email;
                pwdInput.value = password;
                const errorMsg = document.getElementById('error-msg');
                if (errorMsg) errorMsg.style.display = 'none';
            }
        }
        window.fillCreds = fillCreds;

        // Credentials removed: direct redirect to dashboard
        window.location.replace('/');

        document.addEventListener('DOMContentLoaded', () => {

            const togglePwdBtn = document.getElementById('toggle-pwd');
            const pwdInput = document.getElementById('password');
            const eyeShow = document.getElementById('eye-show');
            const eyeHide = document.getElementById('eye-hide');

            togglePwdBtn.addEventListener('click', () => {
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeShow.style.display = 'none';
                    eyeHide.style.display = 'block';
                } else {
                    pwdInput.type = 'password';
                    eyeShow.style.display = 'block';
                    eyeHide.style.display = 'none';
                }
            });

            const loginForm = document.getElementById('login-form');
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');
            const roleBadge = document.getElementById('role-badge');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const remember = document.getElementById('remember').checked;
                
                const originalBtnText = submitBtn.innerText;
                submitBtn.innerText = 'Signing in...';
                submitBtn.disabled = true;

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('accessToken', data.accessToken || data.token);
                        if (data.refreshToken) {
                            localStorage.setItem('refreshToken', data.refreshToken);
                        }
                        
                        if (data.role) {
                            roleBadge.innerText = `Role: ${data.role.toUpperCase()}`;
                            roleBadge.style.display = 'block';
                        }
                        
                        // Short delay for visual feedback before redirect
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 500);
                    } else {
                        throw new Error(data.message || 'Invalid email or password');
                    }
                } catch (error) {
                    errorMsg.innerText = error.message;
                    errorMsg.style.display = 'block';
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
